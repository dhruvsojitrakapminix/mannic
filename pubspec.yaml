name: bit_tv
description: BitTV — Movies, TV Shows & Short Drama.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.1
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0

  # State / Routing
  get: ^4.6.6
  get_storage: ^2.1.1

  # Network
  dio: ^5.4.3

  # Firebase
  firebase_core: ^2.24.2
  firebase_remote_config: ^4.3.8
  firebase_crashlytics: ^3.4.9

  # Ads
  google_mobile_ads: ^9.2.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.2
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding/moods/
    - assets/images/onboarding/platforms/
    - assets/icons/nav/

flutter_native_splash:
  color: "#000000"
  image: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    color: "#000000"
  fullscreen: true
  android: true
  ios: true